name: Complete source and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact source files from the DEB payload
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source/locale/en/LC_MESSAGES source/locale/ja/LC_MESSAGES

          base64 -d source/mp3_tagger.py.gz.b64 | gzip -dc > source/mp3_tagger.py
          base64 -d source/nautilus_mp3_tagger.py.gz.b64 | gzip -dc > source/nautilus_mp3_tagger.py
          base64 -d source/mp3-tagger.nemo_action.gz.b64 | gzip -dc > source/mp3-tagger.nemo_action
          base64 -d source/locale/en/LC_MESSAGES/mp3-tagger.mo.b64 > source/locale/en/LC_MESSAGES/mp3-tagger.mo
          base64 -d source/locale/ja/LC_MESSAGES/mp3-tagger.mo.b64 > source/locale/ja/LC_MESSAGES/mp3-tagger.mo

          chmod +x source/mp3_tagger.py source/nautilus_mp3_tagger.py

      - name: Restore the original DEB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat release/mp3-tagger_1.0.2-3_all.deb.part-aa.b64 \
              release/mp3-tagger_1.0.2-3_all.deb.part-ab.b64 \
              release/mp3-tagger_1.0.2-3_all.deb.part-ac.b64 \
              release/mp3-tagger_1.0.2-3_all.deb.part-ad.b64 \
            | base64 -d > dist/mp3-tagger_1.0.2-3_all.deb
          dpkg-deb --info dist/mp3-tagger_1.0.2-3_all.deb >/dev/null

      - name: Commit complete source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/mp3_tagger.py source/nautilus_mp3_tagger.py source/mp3-tagger.nemo_action source/locale/en/LC_MESSAGES/mp3-tagger.mo source/locale/ja/LC_MESSAGES/mp3-tagger.mo
          if ! git diff --cached --quiet; then
            git commit -m "Restore complete source files from v1.0.2 DEB"
            git push origin HEAD:main
          fi

      - name: Create v1.0.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.2 >/dev/null 2>&1; then
            gh release upload v1.0.2 dist/mp3-tagger_1.0.2-3_all.deb --clobber
          else
            gh release create v1.0.2 dist/mp3-tagger_1.0.2-3_all.deb \
              --title "v1.0.2" \
              --notes-file README.md
          fi
