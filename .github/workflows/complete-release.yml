name: Complete source and release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore exact source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source

          decode_b64() {
            local input="$1"
            local output="$2"
            tr -d '\r\n[:space:]' < "$input" > "$input.tmp"
            local n
            n=$(wc -c < "$input.tmp")
            local pad=$(( (4 - n % 4) % 4 ))
            if [ "$pad" -gt 0 ]; then
              printf '%*s' "$pad" '' | tr ' ' '=' >> "$input.tmp"
            fi
            base64 --ignore-garbage -d "$input.tmp" > "$output"
            rm -f "$input.tmp"
          }

          decode_b64 source/mp3_tagger.py.gz.b64 source/mp3_tagger.py.gz
          decode_b64 source/nautilus_mp3_tagger.py.gz.b64 source/nautilus_mp3_tagger.py.gz
          decode_b64 source/mp3-tagger.nemo_action.gz.b64 source/mp3-tagger.nemo_action.gz

          gzip -dc source/mp3_tagger.py.gz > source/mp3_tagger.py
          gzip -dc source/nautilus_mp3_tagger.py.gz > source/nautilus_mp3_tagger.py
          gzip -dc source/mp3-tagger.nemo_action.gz > source/mp3-tagger.nemo_action

          chmod +x source/mp3_tagger.py source/nautilus_mp3_tagger.py
          python3 -m py_compile source/mp3_tagger.py source/nautilus_mp3_tagger.py

      - name: Restore original DEB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          : > dist/mp3-tagger_1.0.2-3_all.deb
          for part in \
            release/mp3-tagger_1.0.2-3_all.deb.part-aa.b64 \
            release/mp3-tagger_1.0.2-3_all.deb.part-ab.b64 \
            release/mp3-tagger_1.0.2-3_all.deb.part-ac.b64 \
            release/mp3-tagger_1.0.2-3_all.deb.part-ad.b64
          do
            python3 -c 'import base64,re,sys; d=open(sys.argv[1],encoding="utf-8").read(); d=re.sub(r"[^A-Za-z0-9+/]", "", d); d += "="*((4-len(d)%4)%4); sys.stdout.buffer.write(base64.b64decode(d, validate=False))' "$part" >> dist/mp3-tagger_1.0.2-3_all.deb
          done
          test "$(stat -c %s dist/mp3-tagger_1.0.2-3_all.deb)" -eq 9008
          dpkg-deb --info dist/mp3-tagger_1.0.2-3_all.deb >/dev/null

      - name: Commit complete source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/mp3_tagger.py source/nautilus_mp3_tagger.py source/mp3-tagger.nemo_action
          if ! git diff --cached --quiet; then
            git commit -m "Restore complete v1.0.2 source files"
            git push origin HEAD:main
          fi

      - name: Create v1.0.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.2 >/dev/null 2>&1; then
            gh release upload v1.0.2 dist/mp3-tagger_1.0.2-3_all.deb --clobber
          else
            gh release create v1.0.2 dist/mp3-tagger_1.0.2-3_all.deb --target main --title "v1.0.2" --notes $'MP3 Tag Editor for Nemo and Nautilus — v1.0.2\n\n🖖 Live long and prosper.'
          fi
